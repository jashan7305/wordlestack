
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordlestack
    restart: unless-stopped

    ports:
      - "8002:8000"

    environment:
      APP_NAME: WordleStack
      DEBUG: "false"
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}

      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}

      SECRET_KEY: ${SECRET_KEY}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8002}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8002}

    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    # ports:
    #   - "127.0.0.1:5432:5432"
    image: postgres:18
    container_name: wordlestack-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - wordlestack_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wordlestack_data:
